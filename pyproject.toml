[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agbalu"
dynamic = ["version"]
description = "AƔBALU — Kabyle (Taqbaylit) NLP corpus and model stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Abderahmane Ainouche" }]
keywords = ["kabyle", "taqbaylit", "tamazight", "berber", "nlp", "low-resource"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.34",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    # 2.x is the floor: 1.x has no scoring signature, and a metric without its
    # signature is not comparable, which is the whole disease Phase 7 treats.
    "sacrebleu>=2.4",
    # 0.2 adds `seed_sentencepieces_file`, which the §11.5 seeded initialization needs;
    # 0.2.2 is the first release with inline types, which the protocols here are checked
    # against. Core rather than an extra: AƔBALU-Tok is a deliverable.
    "sentencepiece>=0.2.2",
]

[project.optional-dependencies]
# Baseline inference for the benchmark. Kept out of the core dependencies so the
# corpus pipelines install without a 2 GB deep-learning stack.
models = [
    "torch>=2.4",
    "transformers>=4.44",
    # A training checkpoint is not a release: `tools.export_release` writes the weights
    # alone in safetensors. It arrives transitively with transformers, but the export
    # imports it directly, and an undeclared import is one that breaks on a lean install.
    "safetensors>=0.4",
    # `tools.stage_hub` builds the published `tokenizer.json` files directly against the
    # Rust backend. It arrives transitively with transformers, but an undeclared import is
    # one that breaks on a lean install.
    "tokenizers>=0.20",
    # Task 7.4 scores two fastText language identifiers. `fasttext-numpy2`
    # rather than `fasttext`: upstream 0.9.3 calls `np.array(..., copy=False)`,
    # which numpy 2 raises on, so `predict` is unusable on any current install.
    # It provides the same `fasttext` module.
    "fasttext-numpy2>=0.10.4",
    # `agbalu.ocr.trainer_pro` scores a whole held-out split per epoch. A C extension
    # rather than `agbalu.ocr.evaluate.levenshtein_distance`, which is the pure-Python
    # implementation the Feraoun-36M evaluation uses: at this split size the Python one
    # costs more than the training it interrupts. Declared here because the module
    # imports it, and an undeclared import is one whose tests cannot run.
    "editdistance>=0.8",
]
# Phase 11's corpus builders: wikitext stripping for kabwiki, near-duplicate hashing, a
# safe XML parser for the dump, and parquet for the web sources. The training stack on the
# HPC is pinned whole in requirements/hpc.lock.
llm = [
    "mwparserfromhell>=0.7",
    "datasketch>=1.6",
    "defusedxml>=0.7",
    "pyarrow>=17",
]
# Local decoding with a released Fadhma directory. Separate from `models`: the benchmark
# inference stack has no reason to grow an audio decoder, and `soundfile` and `librosa` were
# previously declared nowhere at all — they existed only inside the Modal ASR image, so
# `agbalu.speech.transcribe` would have been an undeclared import on every lean install.
speech = [
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyctcdecode>=0.5",
    "kenlm>=0.2",
    # `agbalu.tts.restore` calls `torchaudio.compliance.kaldi.fbank`, which is the
    # filterbank the restoration checkpoints were traced against. Declared rather than
    # left to the container: an undeclared import is one that breaks on a lean install.
    "torchaudio>=2.4",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-defusedxml>=0.7",
    # The character map a face declares, which is the ground truth `fonts_pro`'s rendered
    # probe stands in for. Test-only: the renderer itself needs Pillow and nothing more.
    "fonttools>=4.50",
]

[project.urls]
Repository = "https://github.com/abderahmane-ai/agbalu"

[tool.hatch.version]
path = "src/agbalu/_about.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agbalu"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools", "modal_app"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "RUF001", # ambiguous-unicode-character-string: Kabyle orthography needs ɣ/ɛ/ḥ...
    "RUF002", # ... including inside docstrings
    "RUF003", # ... and comments
]

[tool.ruff.lint.per-file-ignores]
# T20: a command-line entry point reports to stdout; that is the whole of its job. The
#      library modules it calls stay print-free, and the rule still applies to them.
"src/agbalu/**/cli.py" = ["T20"]
# `src/agbalu/hub/**` is copied verbatim into the published repositories and loaded there
# by `transformers` with `trust_remote_code=True`, so its shape is that library's contract
# rather than this project's.
# TID252: custom code on the Hub resolves siblings by relative import. It is what the
#         documented layout uses and what every published example does; an absolute
#         `agbalu.hub.*` import is exactly the dependency these files exist to avoid.
# ARG002: `attention_mask` and `**kwargs` are `transformers`' calling convention. Juba
#         accepts a mask and ignores it because the published weights were evaluated
#         attending over padding, and dropping the parameter changes how the library
#         dispatches rather than tidying anything.
# PLR0913: a configuration class is its fields. Collapsing them into a container is the
#          one shape `PreTrainedConfig` cannot serialise.
# ANN401: `PreTrainedConfig.__init__` declares some forty differently-typed keyword
#         parameters and a saved config may carry any of them, so `Any` is the correct
#         annotation for what is forwarded, not a way around writing one — `object` does
#         not type-check against that signature.
# RUF012: `_tied_weights_keys` is declared as an instance variable on `PreTrainedModel`,
#         so annotating the override `ClassVar` is a mypy error. The two rules disagree
#         and the library decides.
# S107:   `pad_token`, `bos_token` and `eos_token` are `PreTrainedTokenizer`'s own parameter
#         names, and their defaults are the phoneme table's boundary symbol. The rule reads
#         any string default on a parameter ending in `_token` as a credential.
"src/agbalu/hub/**" = [
    "ANN401",
    "ARG002",
    "PLR0913",
    "RUF012",
    "TID252",
    "PLC0415",
    "T201",
    "N806",
    "S107",
]
# PLC0415: `torch`, `transformers`, `soundfile`, `librosa` and `pyctcdecode` are the optional
#          `models` and `speech` extras. `audio_files` and `read_vocabulary` are what a test
#          exercises without any of them, and a module-scope import would make the whole
#          speech CLI — `corpus`, `vocabulary`, `lm`, `release` — need an audio stack.
"src/agbalu/speech/transcribe.py" = ["PLC0415"]
# PLC0415: `torch`, `transformers`, `tokenizers` and `sentencepiece` are the optional
#          `models` extra. Imported at module scope, staging a release would be
#          unimportable on an install that has only the corpus pipelines.
# S105, S106: `[PAD]`, `[UNK]`, `[CLS]`, `[SEP]`, `[MASK]` are special-token names. The
#             rule reads any string assigned to a `*_token` argument as a credential.
# S311:       the typeface Feraoun's verification probe is rendered in. Fixed so two
#             stagings of the same weights produce the same line to compare.
"tools/stage_hub.py" = ["PLC0415", "S105", "S106", "S311"]
# S105, S106: the vocabularies here are `[PAD]`, `[UNK]`, `[CLS]`, `[MASK]` and `|`, and
#             the rule reads any string named `*_token` as a credential.
"tests/**" = ["S101", "PLR2004", "SLF001", "S311", "S105", "S106"]
# PLR0913: `profile_for` builds a `ClipProfile`, which is eighteen measurements. A test
#          factory takes one keyword per field it varies, and bundling them into a config
#          object would hide which measurement a case is actually about.
"tests/unit/test_tts_corpus.py" = ["PLR0913"]
# PLC0415: `transformers` is the optional `models` extra and `write_config` imports it
#          lazily, so the module must stay importable on an install without it. A
#          top-level import here would break collection of the whole unit suite.
"tests/unit/test_speech_release.py" = ["PLC0415"]
# ARG002: the Protocol-conforming fakes must accept the parameters they are handed, and
#         the keyword names are part of the contract under test, so they cannot be
#         renamed to the dummy pattern.
"tests/unit/test_bench_translate.py" = ["ARG002"]
# ARG001: a pytest hook's signature is pytest's, not this file's — the parameters are how
#         the plugin is dispatched and renaming or dropping one unregisters the hook.
# SLF001: `os._exit` is the whole point. A normal exit runs the C finalisers that were
#         crashing the interpreter after every test had already passed.
"tests/conftest.py" = ["ARG001", "SLF001"]
# S603: the git fetcher runs a resolved absolute `git` with a fixed argument list
#       and no shell. The only external value is a registry URI, which is
#       schema-validated and passed as an argv element, never interpolated.
"src/agbalu/acquire/fetch.py" = ["S603"]
# TRY400: a source failing to fetch is an expected, handled outcome recorded as a
#         deferral, not a crash. One line per failure keeps a 62-source run
#         readable (CLAUDE.md 3.7); the traceback is logged at DEBUG.
"src/agbalu/acquire/cli.py" = ["TRY400"]
# PLC0415: `agbalu.bench.taggers` imports torch and transformers, the optional
#          `models` extra. Importing it at module scope would break `audit`,
#          `contamination` and `score` on an install without them.
"src/agbalu/bench/cli.py" = ["PLC0415"]
# PLC0415: same reason — `fasttext` is the optional `models` extra, imported at
#          load time so the gate and every other bench command run without it.
"src/agbalu/bench/lid_systems.py" = ["PLC0415"]
# S311: `random.Random` draws the LID evaluation sample and the per-source reservoir. Both
#       are seeded precisely so the draw is reproducible and auditable; a cryptographic
#       generator would make the sets unreproducible, the opposite of what is wanted.
# S314: `xml.etree` parses the Shawiya and Tachelhit Wikimedia dumps. The bytes are not
#       untrusted input: they are fetched from dumps.wikimedia.org by `agbalu.acquire`,
#       SHA-256 recorded in the manifest, and re-hashed by `make acquire-verify` before
#       any read.
"src/agbalu/bench/lid_sources.py" = ["S311", "S314"]
"src/agbalu/bench/lid.py" = ["S311"]
# S311: `random.Random(seed)` draws the dev split. Seeded so the split reproduces across
#       builds; a cryptographic generator would make the dataset unreproducible.
"src/agbalu/bench/lid_dataset.py" = ["S311"]
# S311: `random.Random(seed)` drives the phrase augmentation and the group sampler, both
#       seeded from `TrainConfig.seed` so a run reproduces.
# PLR0913: `train_identifier` takes the two configs, the data directory, the checkpoint
#          directory, the device and the resume flag. Bundling them would hide which of
#          the two configs a caller is actually setting, which is the distinction the
#          split into `ModelConfig` and `TrainConfig` exists to draw.
"src/agbalu/lid/dataset.py" = ["S311"]
"src/agbalu/lid/train.py" = ["PLR0913"]
# PLC0415: `likelihoods` imports torch at call time, so `measure`, `prepare` and every
#          figure derived from them stay importable on an install without a training stack.
# PLR0913: it takes the population, the tokenizer, the model, the two special ids, the
#          device and the two loop bounds. The special ids belong to the tokenizer that was
#          injected, not to a config object, and bundling them would hide the one decision
#          this function exists to keep in one place — what is padding and what is scored.
"src/agbalu/llm/baseline.py" = ["PLC0415", "PLR0913"]
# PLC0415: here the deferred import *is* the feature. `available()` exists to probe for an
#          optional package, which cannot be done at module scope without making it
#          mandatory — and the module must stay importable without a training stack, because
#          it is what states the loss's definition: the causal shift and gemma-4's softcap.
# PLR0913: the two loss functions take the three tensors and three keyword-only options
#          (softcap, ignore index, reduction), each part of the definition a test varies.
"src/agbalu/llm/loss.py" = ["PLC0415", "PLR0913"]
# PLC0415: the Phase 11 corpus and training modules import torch, transformers, pyarrow,
#          datasketch, mwparserfromhell, defusedxml, fla, torchao and lm-eval at call time.
#          The first group is the `llm` extra, the last three exist only on the HPC, and
#          the modules must import on the laptop the gate runs on.
"src/agbalu/llm/decontaminate.py" = ["PLC0415"]
"src/agbalu/llm/kernels.py" = ["PLC0415"]
"src/agbalu/llm/train.py" = ["PLC0415"]
"src/agbalu/llm/smoke.py" = ["PLC0415"]
"src/agbalu/llm/progress.py" = ["PLC0415"]
"src/agbalu/llm/merge.py" = ["PLC0415"]
"src/agbalu/llm/assemble.py" = ["PLC0415"]
"src/agbalu/llm/dedupe.py" = ["PLC0415"]
# S311: `random.Random(SEED)` draws the evaluation subset, seeded so every model compared is
#       scored on the same examples. lm-eval and vLLM exist only in the pod's vLLM env.
"src/agbalu/llm/chat_eval.py" = ["PLC0415", "S311"]
# S311: `random.Random(seed)` orders the segments before first-fit packing, seeded so the
#       rows reproduce.
"src/agbalu/llm/sft_rows.py" = ["S311"]
# S311: `random.Random(seed)` draws and orders the replay documents, seeded to reproduce.
"src/agbalu/llm/sft_build.py" = ["S311"]
# S311: `random.Random(SEED)` allocates the seed cards and draws their passages, seeded so
#       the seed bank reproduces card for card.
"src/agbalu/llm/seeds.py" = ["S311"]
# S311: `random.Random(SEED)` draws the translation pairs and their request templates, seeded
#       so the conversations reproduce.
"src/agbalu/llm/translations.py" = ["S311"]
# PLR0913: `Builder` takes the scorer, the index, the counter, both sinks and the batch;
#          each is injected so the build runs in a test without a model or a disk.
"src/agbalu/llm/documents.py" = ["PLC0415", "PLR0913"]
# PLR0913: `Backbone.__call__` restates the keyword arguments transformers' varlen path
#          reads; a bundle would not be what the model accepts.
"src/agbalu/llm/forward.py" = ["PLC0415", "PLR0913"]
# PLR0913: `summary` takes the encoded stream, its order, the write report and the three
#          per-kind lists it reconciles; each is a separate input to the conservation check.
"src/agbalu/llm/pack.py" = ["PLC0415", "PLR0913"]
# PLR0913: `sample` takes the source, its budget and the four collaborators a test fakes.
# S311:    `random.Random(seed)` decides which rows are kept and the shard order. Seeded so
#          the sample reproduces; a cryptographic generator would make it unrepeatable.
"src/agbalu/llm/replay.py" = ["PLC0415", "PLR0913", "S311"]
# PLR0913: `greedy` takes the model, the tokenizer, the prompts, their budgets, the device
#          and the batch size; the budgets are per prompt and cannot live on a config.
# S311:    `random.Random(seed)` draws the SIB-200 demonstrations, seeded so they reproduce.
"src/agbalu/llm/evaluate.py" = ["PLC0415", "PLR0913", "S311"]
# S603, S607: `git rev-parse` and `git status` with fixed arguments; nothing reaches the
#             command line from input.
"src/agbalu/llm/provenance.py" = ["S603", "S607"]
# S603, S607: `ssh`, `rsync` and `tmux` with arguments this module builds and quotes; the
#             only user values are run ids and model paths, passed through `shlex.quote`.
"tools/launch.py" = ["S603", "S607"]
# PLR0913: `select` takes the pool, the two exclusion sets, the size and the three
#          constants that define the set's shape — length floor, speaker cap and seed.
#          Each is a separate decision a reviewer has to be able to see and a test has to
#          be able to vary; bundling them into a config object would satisfy the counter
#          and hide what the prompt set is.
# S311:    `random.Random(seed)` draws the prompt set. It is seeded precisely so the draw
#          reproduces — a cryptographic generator would make the published number
#          unrepeatable, which is the opposite of the property being bought.
"src/agbalu/tts/prompts.py" = ["PLR0913", "S311"]
# PLC0415: `numpy` is reached only by `apply`, which cuts and gains a waveform. Everything
#          else here — the verdicts, the level target, the splits, the lists — is what
#          decides the corpus, and it must stay importable and testable without an audio
#          stack, because those decisions are the deliverable and the audio is their output.
# S311:    `random.Random(seed)` draws the held-out sets. Seeded precisely so the split
#          reproduces; a cryptographic generator would make the corpus unrepeatable.
"src/agbalu/tts/corpus.py" = ["PLC0415", "S311"]
# S311:    the same seeded draw, for the same reason — the validation list must reproduce.
# PLR0911: `verdict` returns one named reason per way a clip can fail, and the count *is* the
#          contract: a corpus build that absorbs a drop instead of naming it is how 12,122
#          clips went missing under one label. Collapsing the returns would collapse the
# PLC0415: `torch`, `torchaudio`, `librosa` and `huggingface_hub` are the container's
#          stack. At module scope the constants this file exists to state — the traced
#          checkpoints, their licence, and the filterbank parameterisation the feature
#          predictor was fitted to — would be unreadable without a GPU image installed.
"src/agbalu/tts/restore.py" = ["PLC0415"]
# S311:    `random.Random(seed)` interleaves the two voices for the multi-speaker Stage 1
#          list. Seeded so the merged corpus reproduces; the alternative is voice order,
#          which is what makes a loss curve track the speaker rather than the model.
# PLR0913: `select_ood` takes one keyword per decision it makes, and two of them —
#          the exclusion set and the length floor — are what decide whether the artifact
#          is contaminated or hangs the recipe's sampler. A config object would hide both.
"src/agbalu/tts/training.py" = ["S311", "PLR0913"]
# S311: `random.Random(seed)` draws the OOD reservoir over the whole text corpus. Seeded so
#       the set reproduces; the alternative already bit once — a prefix returned 5,179 rows
#       from a single source, which is one register of Kabyle rather than a sample of it.
"src/agbalu/tts/cli.py" = ["S311"]
# S105: `[PAD]` and `[UNK]` are `Wav2Vec2CTCTokenizer`'s literal special tokens, and the
#       names are fixed by that class rather than chosen here. A constant ending in
#       `_TOKEN` is an ASR vocabulary entry in this package, never a credential.
"src/agbalu/speech/vocabulary.py" = ["S105"]
# PLC0415: `translation_records` imports pyarrow at call time, the `llm` extra.
"src/agbalu/llm/mixture.py" = ["PLC0415"]
# PLC0415: `require_tensor` imports torch at call time for one `isinstance`, so prompt
#          assembly, shot sampling and hypothesis extraction stay importable — and unit
#          testable — on an install with no training stack.
"src/agbalu/llm/prompting.py" = ["PLC0415"]
# PLC0415: `HubEncoder` and `SentencePieceEncoder` import `transformers` and
#          `sentencepiece` at construction, and the GPU commands import torch, the trainer
#          and the smoke when run, so `--help`, argument errors and the corpus commands work
#          on an install without a training stack.
"src/agbalu/llm/cli.py" = ["PLC0415", "T20"]
# PLC0415: same reason — `generate` imports torch at call time so `audit`, `contamination`
#          and `score` keep working on an install without the `models` extra.
# PLR0913: `generate` takes the batch, both collaborators, the forced target token, the
#          device and the batch size. Bundling the model with its tokenizer would satisfy
#          the counter without making the call site clearer.
"src/agbalu/bench/translate.py" = ["PLC0415", "PLR0913"]
# PLR0913: `ProbeTagger.fit` takes the frozen encoder, its tokenizer, the training
#          sentences, the device, the checkpoint step it reports as `revision`, and the
#          hyperparameters — which are already bundled into `ProbeConfig`. The remaining
#          six are each a distinct collaborator, and folding any two would hide one.
"src/agbalu/bench/probe.py" = ["PLR0913"]
# PLC0415: `agbalu.model.trainer` pulls in torch. Importing it at module scope would break
#          `data`, which is the command you run *before* deciding whether to install a
#          training stack at all.
"src/agbalu/model/cli.py" = ["PLC0415"]
# PLC0415: same reason — `model`, `train` and `infer` pull in torch, while `corpus` builds
#          the splits with the corpus pipelines alone. A top-level import would make the one
#          subcommand that needs no training stack the one that cannot run without it.
# TRY400: a missing corpus or tokenizer is an operator error with a one-line remedy in the
#         message. A traceback for "run `make punctuation TASK=corpus` first" is noise.
"src/agbalu/punctuation/cli.py" = ["PLC0415", "TRY400"]
# TRY400: same — a missing checkpoint, config or vocabulary is an operator error whose
#         remedy is the one command the message names. A traceback would bury it.
"src/agbalu/sentiment/cli.py" = ["TRY400"]
# PLR0913: `Trainer.__init__` takes the two corpora, the settings, the run directory and the
#          device separately because they have different lifetimes — folding them into one
#          container would put a torch device inside a frozen settings object, and the
#          settings are what a resumed run must compare against the checkpoint.
"src/agbalu/punctuation/train.py" = ["PLR0913"]
# PLR0913: batch size and max length are properties of the call, not of the checkpoint, so
#          they belong in the signature rather than in the model.
"src/agbalu/punctuation/infer.py" = ["PLR0913"]
# PLC0415: `trim_model` imports torch at call time so `coverage` and `Remap` — the parts
#          that decide *what* to trim — stay importable without a training stack.
# S105: `<pad>`, `<s>`, `</s>` and `<unk>` are the four special symbols of a character
#       table. The rule reads `*_TOKEN = "..."` as a credential.
"src/agbalu/ocr/vocabulary.py" = ["S105"]
"src/agbalu/ocr/vocabulary_pro.py" = ["S105"]
# S311: the renderer draws a font, a size and an offset. Where those must reproduce — the
#       un-augmented validation render and the line chunking — a seeded `random.Random` is
#       threaded in explicitly; the training draws are meant to differ every epoch. A
#       cryptographic generator buys nothing either way.
"src/agbalu/ocr/synthetic.py" = ["S311"]
"src/agbalu/ocr/augment.py" = ["S311"]
"src/agbalu/ocr/dataset.py" = ["S311"]
"src/agbalu/ocr/cli.py" = ["S311", "PLC0415"]
# The Feraoun-Pro half of the package, same rules for the same reasons.
# PLR2004: pixel thresholds and canvas dimensions read as magic values. Each is a rendering
#          constant named at the top of its module or stated inline in the units it is in.
"src/agbalu/ocr/synthetic_pro.py" = ["S311", "PLR2004"]
"src/agbalu/ocr/backgrounds_pro.py" = ["S311", "PLR2004"]
"src/agbalu/ocr/adlis_gold.py" = ["S311", "PLR2004"]
"src/agbalu/ocr/augment_pro.py" = ["S311"]
"src/agbalu/ocr/dataset_pro.py" = ["S311", "PLR2004", "PLC0415"]
"src/agbalu/ocr/cli_pro.py" = ["PLC0415", "T201"]
"src/agbalu/ocr/model_pro.py" = ["PLR0913"]
# PLR0912/PLR0915/PLR0913: as `trainer.py`. `train_feraoun_pro` is setup, resume, the loop,
#          two evaluations and the summary over shared state; the one part worth isolating,
#          the checkpoint gate that protects the Latin capability, is `CheckpointGate`.
"src/agbalu/ocr/trainer_pro.py" = ["PLR0912", "PLR0913", "PLR0915", "PLC0415"]
# S311: a fixed-seed draw over the held-out split, so two checkpoints are scored on the
#       same pairs. A cryptographic generator would make that irreproducible.
"src/agbalu/standardise/cli.py" = ["S311"]
# PLC0415: `transformers` is imported inside the constructor so the vocabulary, the
#          renderer and the metrics stay importable without a model stack.
"src/agbalu/ocr/models.py" = ["PLC0415"]
# PLR0913/PLR0915: `save_checkpoint` names every piece of resumable state rather than
#          bundling it, and `fit` is one loop over state its steps share.
"src/agbalu/ocr/trainer.py" = ["PLR0913", "PLR0915"]
"src/agbalu/mt/vocab.py" = ["PLC0415"]
# PLR0913: `iter_batches` takes six arguments because resumption needs all of them —
#          epoch, start_batch and drop_last are not defaultable away without hiding the
#          validation bug they exist to prevent.
"src/agbalu/model/data.py" = ["PLR0913"]
# PLR0913: `Trainer` takes both splits, a destination and two optional collaborators.
#          Bundling the splits into a wrapper type would satisfy the counter and carry
#          no meaning.
"src/agbalu/model/trainer.py" = ["PLR0913"]
# S603:    `follow` runs the `modal` CLI resolved through `shutil.which`, with a fixed
#          argument list, no shell, and no value from outside this module. The app name is
#          a module constant.
"modal_app/launch.py" = ["S603"]
# S310:    `urlretrieve` fetches one module constant — the published KabTifinagh parquet —
#          over https, into a staging path it then renames. No value comes from outside.
"modal_app/ocr.py" = ["S310"]
"modal_app/ocr_pro.py" = ["S310"]
# PLR0915/PLR0912: a training entrypoint is one long function on purpose. Setup, resume,
#          the loop, evaluation, checkpointing and the summary share the state they pass
#          between them, and splitting them puts that state in a class whose only caller
#          is the function it came out of. Listed per file, never as a glob over
#          `modal_app/**`, which would also silence every short module in the tree.
"modal_app/asr.py" = ["PLR0915"]
"modal_app/tifinagh.py" = ["PLR0915"]
"modal_app/boulifa.py" = ["PLR0912", "PLR0915"]
"modal_app/simohand.py" = ["PLR0915"]
# N806: `F0_pred` and `N_pred` are StyleTTS2's own names for the pitch and energy the
#       predictor returns, and the recipe's checkpoints key on them.
"modal_app/matoub.py" = ["N806", "PLR0912", "PLR0915"]
# T20:     Modal local entrypoints report to the operator's terminal; that is their job.
# PLC0415: the training imports must happen inside the container, not at local import
#          time — `modal run` imports this file on a laptop that need not have torch.
# PLR0913: a Modal function's parameters are its CLI and its RPC surface. Each one is a
#          separate knob the operator sets from the shell (`--steps`, `--compile-model`,
#          `--schedule-start`); bundling them into an object would satisfy the counter and
#          take the flags away.
# S311: `random.Random(state.epoch)` fixes the batch order so a resumed run replays the
#       order it was interrupted in. A cryptographic generator would make the resume
#       irreproducible, which is the opposite of the property being bought.
"modal_app/**" = ["T20", "PLC0415", "PLR0913", "S311"]
# PLR0913: `stage` takes the source, the destination, the card, the extra files, the
#          architecture and which key suffixes are derived. Each is a separate decision the
#          release recipe makes in the Makefile, and bundling any two would hide what a
#          published directory is actually made of.
"tools/export_checkpoint.py" = ["PLR0913"]
# T20: standalone scripts report to stdout by design.
# PLC0415: deferred imports are intentional — tools may depend on optional extras
#          (e.g. `tokenizers`) and must still run, and fail cleanly, without them.
"tools/**" = ["T20", "PLC0415", "BLE001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools", "modal_app"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# `tokenizers` ships no py.typed marker and has no stubs on PyPI. It is an optional
# extra used only by tools/benchmark_tokenizers.py, never by the package.
[[tool.mypy.overrides]]
module = ["tokenizers.*"]
ignore_missing_imports = true

# Both spellings: `tools/` has no `__init__.py`, so mypy names the module differently
# depending on whether it is reached by path or by package.
[[tool.mypy.overrides]]
module = ["tools.benchmark_tokenizers", "benchmark_tokenizers"]
disallow_any_unimported = false

# `cut-cross-entropy` ships no py.typed marker and no stubs on PyPI, and it only installs
# where Triton does — so it is absent on the laptop the gate runs on. Confined to the one
# module that imports it; `loss.require_tensor` states what is expected back.
[[tool.mypy.overrides]]
module = ["cut_cross_entropy.*"]
ignore_missing_imports = true

# `PreTrainedModel.eval` is `def eval(self):` in transformers 5 — untyped, so any caller
# holding a *typed* model trips `disallow_untyped_calls`. Everywhere else in the tree the
# model comes back from `from_pretrained` as `Any` and the call is invisible; these
# construct a `MatoubForTextToWaveform` or a `DihyaForSequenceClassification` directly.
# Both spellings, because `tools/` has no `__init__.py` and mypy names the module by how
# it was reached.
[[tool.mypy.overrides]]
module = [
    "tools.export_matoub",
    "export_matoub",
    "tests.unit.test_hub_matoub",
    "tools.export_dihya",
    "export_dihya",
    "tests.unit.test_hub_dihya",
]
disallow_untyped_calls = false

# `Tensor.backward` and `LBFGS.step` are both `def f(self, ...):` in torch — untyped, so a
# caller holding a *typed* tensor trips `disallow_untyped_calls`. Everywhere else in the tree
# the loss arrives from `nn.Module.__call__` as `Any` and the call is invisible; this module
# builds its own objective and annotates it. Confined to the one module that runs L-BFGS.
[[tool.mypy.overrides]]
module = ["agbalu.sentiment.calibrate"]
disallow_untyped_calls = false

# `safetensors.safe_open` is declared in the package's own `__init__.pyi` with unannotated
# methods (`get_tensor(self, name)`, `get_slice(self, name)`), so every call trips
# `disallow_untyped_calls`. Reading a checkpoint tensor by tensor, without loading whole
# shards, needs exactly those methods. Confined to the module that merges checkpoints and
# its test.
[[tool.mypy.overrides]]
module = [
    "agbalu.llm.merge",
    "agbalu.llm.assemble",
    "tests.unit.test_llm_merge",
    "tests.unit.test_llm_assemble",
]
disallow_untyped_calls = false

# `pyarrow` ships no py.typed marker and no stubs on PyPI.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# `editdistance` is a C extension with no stubs. It is one call returning an int, and the
# metric functions that use it declare what they return.
[[tool.mypy.overrides]]
module = ["editdistance.*"]
ignore_missing_imports = true

# `fontTools` ships no py.typed marker. Reached from one test, which reads a face's cmap to
# check the rendered glyph probe against the font's own declaration.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true


# `soundfile` and `librosa` ship no py.typed marker and no stubs on PyPI. Both are the
# ASR image only, and `_load_audio` states the array type it returns.
[[tool.mypy.overrides]]
module = ["soundfile.*", "librosa.*"]
ignore_missing_imports = true

# `torchaudio.compliance.kaldi` ships no py.typed marker. It is reached from one function,
# which states the tensor shape it returns; the filterbank parameters are named constants
# beside it rather than inferred from a signature.
[[tool.mypy.overrides]]
module = ["torchaudio.*"]
ignore_missing_imports = true

# `torch.jit.load` carries no annotations, so loading a traced module is an untyped call in
# a typed context. Confined to the one module that loads the restoration checkpoints; what
# they return is narrowed by `Restorer.restore`, not silenced.
[[tool.mypy.overrides]]
module = ["agbalu.tts.restore"]
disallow_untyped_calls = false

# `Wav2Vec2ForCTC.freeze_feature_encoder` carries no annotations, so calling it is an
# untyped call in a typed context. Confined to the one module that constructs the CTC
# model. The other transformers boundary — `PreTrainedModel.to`, whose decorator types
# its argument as the model — is narrowed in the code rather than silenced here.
[[tool.mypy.overrides]]
module = ["modal_app.asr"]
disallow_untyped_calls = false

# `pyarrow.parquet.read_table` and `write_table` carry no annotations, so calling either is
# an untyped call in a typed context. Confined to the modules that touch parquet directly;
# what comes back is narrowed in the code, not silenced.
[[tool.mypy.overrides]]
module = [
    "agbalu.extract.readers",
    "agbalu.lexicon.readers",
    "agbalu.bench.lid_sources",
    "agbalu.bench.tifinagh",
    "agbalu.bench.inflect",
    "agbalu.ocr.dataset",
    "agbalu.ocr.dataset_pro",
    "modal_app.boulifa",
    "tools.build_kabinflect",
    "tools.build_kabtifinagh",
    "tools.build_kabliterary",
    "tools.export_datasets",
    "tests.unit.test_lexicon_readers",
    "tests.unit.test_lid_sources",
    "tests.unit.test_build_kabliterary",
    "agbalu.llm.decontaminate",
    "agbalu.llm.documents",
    "agbalu.llm.evaluate",
    "agbalu.llm.mixture",
    "agbalu.llm.replay",
    "tests.unit.test_llm_documents",
    "tests.unit.test_llm_evaluate",
    "tests.unit.test_llm_mixture",
]
disallow_untyped_calls = false
disallow_any_unimported = false

# `datasketch` ships no py.typed marker and no stubs. Reached only by `dedupe.NearDuplicates`,
# which uses `MinHash.update` and `MinHashLSH.query`/`insert` and states what it keeps.
[[tool.mypy.overrides]]
module = ["datasketch.*"]
ignore_missing_imports = true

# The `MinHashLSH` attribute is annotated with the unstubbed class, which `disallow_any_unimported`
# reads as `Any`; confined to the one module that holds it.
[[tool.mypy.overrides]]
module = ["agbalu.llm.dedupe"]
disallow_any_unimported = false

# The vendored StyleTTS2 tree. `matoub_infer` and the voicepack loader published beside
# `Matoub-82M` both run from inside a `git clone` of the recipe, whose modules sit at the
# clone root rather than under a package — `models`, `utils`, `Utils.PLBERT.util`,
# `Modules.diffusion.sampler`. They exist only in the container and only after the clone,
# so there is nothing for mypy to resolve on the laptop the gate runs on.
# `tests/unit/test_modal_image.py` exempts the same four names for the same reason.
[[tool.mypy.overrides]]
module = ["models", "utils", "Utils.*", "Modules.*"]
ignore_missing_imports = true

# `fasttext` ships no py.typed marker and no stubs on PyPI. Confined to the one
# module that loads it; `_FastTextModel` states the surface actually used.
[[tool.mypy.overrides]]
module = ["fasttext.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tools.character_census", "character_census"]
disallow_untyped_calls = false

# `fla`, `torchao` and `lm_eval` are installed only on the HPC (requirements/hpc.lock), so
# the laptop the gate runs on cannot resolve them. Each is reached from one call site that
# states the type it hands on: `kernels.packed_causal_conv1d` a tensor, `train.build_optimizer`
# an `Optimizer`, `evaluate.read_metric` a float checked at runtime.
[[tool.mypy.overrides]]
module = ["fla.*", "torchao.*", "lm_eval.*"]
ignore_missing_imports = true

# The `transformers` boundary. Its `py.typed` marker promises more than the annotations
# deliver: `PreTrainedConfig.__init_subclass__`, `PreTrainedModel.post_init` and
# `nn.Module.eval` carry none, so subclassing or constructing a model is an untyped call;
# the model-output dataclasses annotate their fields as `torch.FloatTensor`, a deprecated
# alias no torch operation returns; and `forward` and `get_encoder` are declared on the
# base with `Any` returns and variable signatures, so any faithful override is reported as
# incompatible. Confined to the modules that subclass the library. What these modules
# actually promise is checked by test, not by annotation: `tests/unit/test_hub_*.py`
# asserts they produce the training modules' outputs tensor for tensor.
[[tool.mypy.overrides]]
module = [
    "agbalu.hub.*",
    "agbalu.speech.release",
    "modal_app.simohand",
    "tools.stage_hub",
    "stage_hub",
]
disallow_untyped_calls = false
disable_error_code = ["arg-type", "override"]

# `datasets` ships no py.typed marker. Reached only by `simohand_train`, which wraps the
# corpus rows it already parsed itself; nothing is inferred across the boundary.
[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true

# `matoub_infer` rebinds `torch.load` for the duration of the call, because the recipe's own
# `load_ASR_models`, `load_F0_models` and `load_plbert` call it and torch 2.6 defaults
# `weights_only` true, which no StyleTTS2 checkpoint survives. The shim is variadic by
# construction — it forwards whatever the recipe passes — so its call into `torch.load` is
# the one place the module cannot restate a third-party signature. Our own load bypasses the
# shim and narrows what comes back.
[[tool.mypy.overrides]]
module = ["modal_app.matoub"]
disable_error_code = ["arg-type"]

# The same boundary from the test side, plus two codes the library forces there:
# `generate` is declared with `self: GenerativePreTrainedModel`, which mypy does not accept
# a faithful subclass as, and it returns a five-way union of which only `LongTensor` has a
# shape. Confined to the tests that drive a real `generate`.
[[tool.mypy.overrides]]
module = [
    "tests.unit.tiny_lm",
    "tests.unit.test_hub_belaid",
    "tests.unit.test_hub_feraoun",
    "tests.unit.test_hub_juba",
    "tests.unit.test_hub_masinissa",
    "tests.unit.test_hub_masinissa_sentiment",
    "tests.unit.test_stage_hub",
    "tests.unit.test_speech_release",
    "tests.integration.test_hub_release_directories",
]
disallow_untyped_calls = false
disable_error_code = ["arg-type", "override", "misc", "union-attr"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: touches the filesystem, network, or real corpus files",
    "slow: takes more than a second",
]
# The suite writes 2.7 GB of `tmp_path` a session — checkpoints, tokenizers, corpora. Under
# the default `all` policy that is kept for three sessions and pruned from an `atexit`
# handler, and `tests/conftest.py` leaves through `os._exit`, which runs no such handler: the
# temp root reached 24 GB over eleven runs and a full volume then killed a run with a bus
# error inside an mmap. Under `failed` each directory is removed in the fixture's teardown,
# during the session, and a green run removes the session root as well.
tmp_path_retention_policy = "failed"
filterwarnings = [
    "error",
    # sentencepiece's SWIG bindings emit these while the C extension is still
    # initialising. Under `error` the exception is raised inside the module init and
    # **segfaults the interpreter** rather than failing a test, which is how the MT
    # harness first appeared to be broken. Third-party and unfixable from here.
    "ignore:builtin type SwigPy.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    # modal 1.5 deprecates `App.registered_*` and `Function.get_raw_f`, the only accessors
    # for an app's function table and a function's Python body, with no public replacement,
    # and removes them in 1.6. `test_modal_image.py` and `test_modal_launch.py` read the
    # wiring through them.
    "ignore:.*`(App\\.registered_\\w+|Function\\.get_raw_f)` is deprecated:modal.exception.DeprecationError",
]

[tool.coverage.run]
source = ["src/agbalu"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
