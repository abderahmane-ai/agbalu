# The HPC training environment, frozen from a working pod on 2026-10-14. `tools.launch setup`
# installs it into a conda env that also holds python 3.12 and conda-forge gcc_linux-64 and
# gxx_linux-64 13, the host compiler TileLang's nvcc JIT needs.
#
# The nvidia-cuda-* and nvidia-nvvm pins stay at 13.0: the driver accepts PTX up to 9.0, and
# 13.4's nvvm emits 9.4, which ptxas rejects. tilelang replaces fla's Triton backward of the
# gated delta rule, which Triton 3.6 computes wrongly on Hopper (fla issue 640).
