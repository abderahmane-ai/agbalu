    notes: >-
      Seed corpus. UTF-8 with BOM, CRLF. 2.60% of rows carry homoglyph corruption
      (Greek epsilon for Latin open-e, Greek gamma for Latin gamma). Tatoeba is
      CC BY 2.0 FR at the collection level; individual sentences vary.

