# AƔBALU corpus registry
#
# Every Kabyle data source known to the project, with the size the provider
# reported at `retrieved` and the licence it declares. Figures were obtained by
# querying the HuggingFace, OPUS, Common Voice, Wikimedia and GitHub APIs on
# 2026-08-05 — none are estimates. See docs/corpus_landscape.md for the analysis.
#
# tier: core          -> enters the released corpus
#       supplementary -> enters licence-compatible cuts only
#       reference     -> consulted, never ingested (benchmarks, specs, models)
#       excluded      -> deliberately left out; `notes` records why
#
# Validated by: make registry
#
# LICENCE AUDIT, Phase 1 task 1.6 (2026-08-06). All 12 unresolved licences were
# re-checked against the HuggingFace API, repository LICENSE files and GitHub's
# licence endpoint. Ten remain genuinely unresolvable because upstream itself is
# vague: `cc` is not a licence (no variant, so CC0 and CC BY-NC-SA are both
# consistent with it), `other` is unspecified, and three declare nothing at all.
# They stay at their declared value and therefore classify as `unclear`, which
# already excludes them from a permissive release cut.
# Two were resolved and acted on:
#   git.sferhah.digitized-dallet  core -> reference (underlying 1982 work in copyright)
#   git.kabyle-specs              no LICENSE file at all; all rights reserved by
#                                 default. Already `reference`, so never ingested.
# Per-source detail: docs/phases/phase-01-acquisition.md
#
# 1.9.0 (2026-08-15, task 12.3). hf.boffire.tughalin-n-weqcic-ijahen was registered
# `text` and holds no text at all — 229 WAVs and no transcript — so it was fetched for
# its modality tag and kept for a content it does not have. Measured synthetic; re-tiered
# `supplementary -> excluded`, `text -> speech`. The tag deciding what gets fetched has
# now cut both ways: f5tts-kabyle-dataset's audio was tagged `speech` and never fetched.

