  - id: cv.common-voice-26-kab
    name: Mozilla Common Voice v26.0 — Kabyle
    modality: speech
    tier: core
    access: http
    uri: https://commonvoice.mozilla.org/en/datasets
    licence: cc0-1.0
    languages: [kab]
    size: { hours: 693.88, rows: 747410, bytes: 18718590707 }
    retrieved: 2026-08-05
    notes: >-
      571.29 validated hours of 693.88 total; 1,607 speakers; released 2026-06-12.
      Kabyle ranks 10th of 294 locales. Splits: train 152,608 / dev 15,004 /
      test 15,004 / validated 615,368 / other 111,915. 53% male, 20% female.
      NOT FETCHABLE BY `acquire`, verified 2026-08-11: the uri is a consent-gated
      landing page and Common Voice moved exclusively to Mozilla Data Collective
      in October 2025, so retrieval needs an account and an API key. `access`
      stays `http` because the enum has no value for a source behind an account;
      `manual` demands a checksum we cannot have until it is downloaded.
      NOT on the ASR critical path: hf.fsicoli.common-voice-22-kab carries
      570.37 of these 571.29 validated hours. What v26 buys is the ~395 validated
      hours outside train/dev/test, whose audio no mirror ships.
      docs/asr_design.md §2.

  - id: hf.fsicoli.common-voice-22-kab
    name: Common Voice v22.0 — Kabyle, community mirror
    modality: speech
    tier: core
