    licence: cc-by-nc-4.0
    languages: [kab, eng, fra]
    size: { rows: 256204 }
    retrieved: 2026-08-08
    notes: >-
      Only the tokenizer files are held; the weights are not. Supports kab_Latn and
      is the MT baseline for task 7.7 now that hf.boffire.marianmt-en-kab is
      unreachable. Measured on a 50k sample of our corpus: fertility 2.452, 11.52
      tokens/sentence, UNK 0.011% (64 tokens, all typographic punctuation) — 1.76x
      the tokens per word of the best Kabyle tokenizer. Its vocabulary carries both
      spellings of every homoglyph pair as single pieces, and its Kabyle merges
      (aɣ, taɣ, iɣ, ṭṭut) are the CORRECT ones, so the homoglyph corruption was not
      baked into it the way it was into the community Kabyle tokenizers. Licence is
      non-commercial: anything fine-tuned from these weights inherits that.

