    licence: cc-by-2.0
    languages: [kab]
    size: { rows: 791018, bytes: 35172949, sentences: 791018, tokens: 3733626 }
    retrieved: 2026-08-05
    checksum: e72c70a576029f955c6ce54b85a95c9f69f3771909ef081d3fcad889183deffa
    notes: >-
      Seed corpus. UTF-8 no BOM, LF. 3 columns: id, lang (always kab), sentence.
      All 791,018 ids and sentence strings are distinct. 662,613 of them have NO
      English pair, making this ~6x more Kabyle text than the paired export and
      the largest single monolingual source held locally. 3.19% of rows carry
      homoglyph corruption; 21.9% of all open-e characters are Greek U+03B5
      instead of Latin U+025B. 498 ids present in the paired export are absent
      here — reconcile in Phase 1.

