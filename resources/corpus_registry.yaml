    licence: mit
    languages: [kab]
    size: { rows: 48011 }
    retrieved: 2026-08-05
    notes: >-
      Lowest measured fertility (1.397 on our 50k sample) but absorbs punctuation
      into word tokens, hiding punctuation boundaries. Also carries Greek epsilon
      in vocab (+21.3% tokens on corrupted sentences). NFKC + lowercase.

