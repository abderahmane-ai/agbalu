    uri: https://huggingface.co/datasets/fsicoli/common_voice_22_0
    licence: cc0-1.0
    languages: [kab]
    size: { hours: 693.35, rows: 746990, bytes: 18638653109 }
    retrieved: 2026-08-11
    notes: >-
      The route that actually works. Public, ungated, CC0, 103 languages;
      release 22.0.0 dated 2025-06-20, read from its own release_stats.py:
      570.37 validated hours of 693.35, 746,990 clips, 1,588 speakers, Kabyle
      9th of 137 locales. Against v26 that is 0.92 validated hours — Kabyle
      contribution has plateaued, so the MDC account buys almost nothing.
      What the mirror ships is the bucketed splits only, 7.89 GiB of the 18.6 GB
      release: train 152,479 / dev 15,002 / test 15,003 (175.52 h, verified
      speaker-disjoint across all three pairs), plus other 112,446 and
      invalidated 20,042. The 432,018 validated clips outside train/dev/test
      have no audio here.
      FETCH_PATTERNS restricts acquisition to transcript/kab/*: the audio goes
      to the Modal volume, since nothing local reads it.

