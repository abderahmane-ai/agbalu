  - id: hf.boffire.kabyle-bpe-tokenizer-v2
    name: Kabyle BPE Tokenizer v2
    modality: tool
    tier: reference
    access: hf
    uri: https://huggingface.co/boffire/Kabyle-BPE-Tokenizer-v2
    licence: apache-2.0
    languages: [kab]
    size: { rows: 48000 }
    retrieved: 2026-08-05
    notes: >-
      Best published Kabyle tokenizer. Metaspace (not ByteLevel), NFC, hyphen kept
      as a morphological marker, CLDR-grounded atomic alphabet. Adopt all four
      decisions. Measured fertility 1.645 on a 50k sample of our corpus, UNK 0.089%.
      Two defects: Greek epsilon is an atomic vocab token (corruption baked in,
      +19.4% tokens on affected sentences) and CLDR omits t-cedilla, which occurs
      3,744x in our corpus.

  - id: hf.boffire.bpe-tokenizer-for-kabyle
