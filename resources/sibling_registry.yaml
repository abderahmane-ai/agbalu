  - id: hf.tamazight-nlp.amawar
    name: Tamazight-NLP AmaWar — Amazigh oral heritage
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/AmaWar
    licence: apache-2.0
    languages: [tzm_Tfng]
    size: { rows: 2324 }
    retrieved: 2026-08-23
    notes: >-
      Proverbs, riddles, poems, stories, idioms and dictionary examples of the Ait
      Warain variety, scraped from amawalwarayni.com. Registered as surveyed and
      NOT usable here: the Amazigh side is Neo-Tifinagh and the gloss is Modern
      Standard Arabic, so nothing in it is Latin script. It was fetched on the
      card's `language: [ber, rif, tzm, ar]`, which names no script; the bytes
      settled it. Kept because it is the only oral-register Amazigh corpus found
      and the Tifinagh models can use it.

  - id: wikimedia.shiwiki
    name: Tachelhit Wikipedia (shi.wikipedia.org)
    modality: text
    tier: reference
    access: wikimedia
    uri: https://dumps.wikimedia.org/shiwiki/
    licence: cc-by-sa-4.0
    languages: [shi_Latn]
    size: { bytes: 5108285 }
    retrieved: 2026-08-23
    notes: >-
      10,893 articles, 97% Latin on a random sample, with Arabic glosses inline
      that the 80% Latin-share filter already tolerates. Larger than kab.wikipedia
      (7,164) and the only encyclopaedic register any sibling has. Confirmed
      against the Meta sitematrix on 2026-08-23: shi, kab and zgh are the live
      Berber Wikipedias, shy has a Wiktionary only, and rif has neither.
