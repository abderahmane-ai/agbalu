# AƔBALU sibling-language registry
#
# Berber languages that are NOT Kabyle, registered for the task-7.4 language
# identification benchmark. Held in a separate file, under a separate root model
# (`SiblingRegistry`), because CLAUDE.md §1 forbids merging these into the Kabyle
# corpus: `SiblingSource` refuses any source declaring `kab`, and no extract,
# parallel or lexicon pipeline can read this file.
#
# These bytes exist to be classified against, never to be ingested.
#
# Scope is Latin script only. Every sibling that FLORES+ or GlotCC carries in
# Tifinagh is separable from Latin-script Kabyle on the encoding alone, which
# would measure the script and report it as language identification.
#
# Sizes are what the provider reported at `retrieved`, queried on 2026-08-09 via
# the HuggingFace tree API (paginated — the tree endpoint caps at 1,000 entries
# and GlotCC has 1,252 partitions) and the Wikimedia dumps index.
#
# Validated by: make sibling-registry

version: "1.2.0"
surveyed: 2026-08-23

sources:

  # =========================================================================
  # GlotCC-V1 — CC0, web-crawled, the only source with four siblings in Latin
  # =========================================================================
  - id: hf.glotcc-v1-shi
    name: GlotCC-V1 — Tashelhit (Latin)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/cis-lmu/GlotCC-V1
    licence: cc0-1.0
    languages: [shi_Latn]
    size: { bytes: 86420 }
    retrieved: 2026-08-09
    notes: >-
      Tashelhit (Taclḥit), Southern Morocco. Partition v1.0/shi-Latn, 1 parquet
      file. Largest Latin-script sibling partition available anywhere surveyed.
      GlotCC labels are themselves GlotLID output, so this is silver, not gold —
      which is exactly why the confusion matrix is the deliverable and not an
      accuracy claim about GlotCC.

  - id: hf.glotcc-v1-rif
    name: GlotCC-V1 — Tarifit (Latin)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/cis-lmu/GlotCC-V1
    licence: cc0-1.0
    languages: [rif_Latn]
    size: { bytes: 62912 }
    retrieved: 2026-08-09
    notes: >-
      Tarifit (Tmaziɣt n Arif), Northern Morocco. Partition v1.0/rif-Latn, 2
      parquet files. A rif-Tfng partition also exists and is deliberately not
      registered: script alone separates it from Kabyle.

  - id: hf.glotcc-v1-taq
    name: GlotCC-V1 — Tamasheq (Latin)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/cis-lmu/GlotCC-V1
    licence: cc0-1.0
    languages: [taq_Latn]
    size: { bytes: 30230 }
    retrieved: 2026-08-09
    notes: >-
      Tamasheq (Tuareg), Mali and Niger. Southern Berber, so the most distant of
      the six siblings and the expected easiest contrast. Partition
      v1.0/taq-Latn.

  - id: hf.glotcc-v1-tzm
    name: GlotCC-V1 — Central Atlas Tamazight (Latin)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/cis-lmu/GlotCC-V1
    licence: cc0-1.0
    languages: [tzm_Latn]
    size: { bytes: 46130 }
    retrieved: 2026-08-09
    notes: >-
      Central Atlas Tamazight, Middle Atlas. The only Latin-script tzm text found
      in the survey: FLORES+ carries tzm in Tifinagh only, and the datasets
      labelled "Tamazight" that mix tzm with Kabyle are the specific hazard this
      benchmark exists to quantify.

  # =========================================================================
  # FLORES+ — the one controlled contrast: identical sentences, both languages
  # =========================================================================
  - id: hf.flores-plus-taq
    name: FLORES+ — Tamasheq (Latin)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/openlanguagedata/flores_plus
    licence: cc-by-sa-4.0
    languages: [taq_Latn]
    size: { sentences: 2009 }
    retrieved: 2026-08-09
    notes: >-
      997 dev + 1,012 devtest, the same English source sentences as kab_Latn.
      The only Berber pair in FLORES+ that shares a script, and therefore the
      only contrast where content is held constant and the classifier cannot win
      on topic. taq_Tfng, tzm_Tfng and zgh_Tfng are not registered (script).
      Inherits the FLORES+ contamination constraint: never ingested, never
      trained on.

  # =========================================================================
  # Bible New Testaments — the content-controlled gold spine. Same verses across
  # languages, human-translated, editorially single-language. All-rights-reserved:
  # never redistributed and never ingested; used locally to hold topic constant so
  # a classifier cannot win on domain, the way FLORES+ does for kab/taq but larger.
  # =========================================================================
  - id: archive.tarifit-nt
    name: Tarifit New Testament, Latin script (Tira Iqedsen, Tmaziɣt n Arif)
    modality: text
    tier: reference
    access: http
    uri: https://archive.org/download/bible-tarifit/Latin-MERGED_djvu.txt
    licence: all-rights-reserved
    languages: [rif_Latn]
    size: { bytes: 4200000 }
    retrieved: 2026-08-23
    notes: >-
      Copyright 2009 DHIMH Multimedia, all rights reserved. Latin script, New
      Testament. Full-text .txt (4.2 MB, DjVu OCR layer) at
      archive.org/download/bible-tarifit. Tarifit's only content-controlled
      source: before this, rif had nothing but silver GlotCC. Verse-aligned to a
      Kabyle NT it holds topic constant, so LID cannot win on domain. Never
      ingested into AƔBALU-Text; redistribution restricted, so excluded from any
      permissive release by code.

  - id: opus.bible-uedin-shi
    name: OPUS bible-uedin — Tashelhit (Latin)
    modality: text
    tier: reference
    access: http
    uri: https://object.pouta.csc.fi/OPUS-bible-uedin/v1/mono/shi.txt.gz
    licence: cc-by-4.0
    languages: [shi_Latn]
    size: { tokens: 129200 }
    retrieved: 2026-08-23
    notes: >-
      Monolingual Tashelhit from OPUS bible-uedin v1, ~129,200 tokens, Latin
      script, one verse per line. Aligned to the Kabyle side (opus.bible-uedin-kab)
      through the same massively-parallel corpus, so it is the redistributable
      content-controlled contrast for shi. cc-by-4.0, so unlike the ARR standalone
      Bibles it can ship. Domain scripture, label-trust gold; register is narrow
      and archaic.

  # =========================================================================
  # Everyday register — Tatoeba, per-record language-labelled, Latin. Offsets the
  # scripture-heavy gold so the model is not learning register instead of language.
  # =========================================================================
  - id: hf.tamazight-nlp.tatoeba
    name: Tamazight-NLP Tatoeba-Translations — sibling slices
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/Tatoeba-Translations
    licence: cc-by-2.0
    languages: [rif_Latn, shi_Latn, shy_Latn]
    size: { rows: 805112 }
    retrieved: 2026-08-23
    notes: >-
      Tatoeba pairs carrying per-record source_lang/target_lang, so the sibling
      side of each row is labelled by a contributor, not a crawl classifier. Latin
      script. Only the rif/shi/shy slices are taken (the corpus also carries kab,
      zgh, thv); the Tashelhit slice alone is ~16k sentences. cc-by-2.0 via Tatoeba.

  # =========================================================================
  # Central Atlas Tamazight — the one substantial Latin tzm source found anywhere
  # =========================================================================
  - id: hf.tamazight-nlp.beni-mellal
    name: Tamazight-NLP Beni-Mellal-Tamazight (Anki)
    modality: text
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/Beni-Mellal-Tamazight
    licence: unknown
    languages: [tzm_Latn]
    size: { rows: 2322 }
    retrieved: 2026-08-23
    notes: >-
      English-to-Tamazight Anki deck, 2,322 rows; the Tamazight column is Central
      Atlas Tamazight (Beni Mellal variety). GlotCC-tzm yields ~283 lines, almost
      all consumed by the held-out set, so without this tzm is untrainable.
      Licence unstated upstream, registered unknown so it is not redistributed but
      is usable for training. Latin script confirmed on fetch.

  # =========================================================================
  # Shawiya — the ṯ contamination lead (CLAUDE.md §6.2)
  # =========================================================================
  - id: wikimedia.shywiktionary
    name: Shawiya Wiktionary (shy.wiktionary.org)
    modality: text
    tier: reference
    access: wikimedia
    uri: https://dumps.wikimedia.org/shywiktionary/
    licence: cc-by-sa-4.0
    languages: [shy]
    size: { bytes: 559338 }
    retrieved: 2026-08-09
    notes: >-
      Shawiya (Tacawit), Aurès. The ONLY live Shawiya Wikimedia project — there
      is no shy.wikipedia — confirmed against the Meta sitematrix API on
      2026-08-09. Registered because AƔBALU-Text v1 carries 5,273 occurrences of
      `ṯ` U+1E6F in lines shaped like shy.wiktionary.org URLs (CLAUDE.md §6.2),
      and that lead cannot be settled without the text it points at. Dump
      20260801, pages-articles. No sibling appears in GlotCC for shy, so this is
      the only acquirable Shawiya text in the survey.

  # =========================================================================
  # Registered 2026-08-23 after the first classifier was measured. A char n-gram
  # scored 98.26% on a same-source dev split and 76.27% on the held-out set: the
  # gap was domain, not language. Every source below buys a *domain* some class
  # did not have, which is the only thing that moves the held-out number.
  # =========================================================================

  - id: hf.tamazight-nlp.nllb-seed-taq
    name: NLLB-Seed — Tamasheq, Latin script
    modality: parallel
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/NLLB-Seed_Tamasheq-Latin-Script
    licence: cc-by-sa-4.0
    languages: [taq_Latn]
    size: { rows: 6193 }
    retrieved: 2026-08-23
    notes: >-
      Professionally translated Wikipedia sentences from the NLLB-Seed effort,
      2.6x the whole previous Tamasheq pool and 100% Latin on inspection. It is
      what lets FLORES+ leave the training set: taq was 78.7% FLORES+ rows, which
      is the split the held-out set is drawn from.

  - id: hf.tamazight-nlp.translatewiki-siblings
    name: Tamazight-NLP translatewiki — sibling slices
    modality: parallel
    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/translatewiki
    licence: cc-by-3.0
    languages: [rif_Latn, shi_Latn, tzm_Latn, shy_Latn]
    size: { rows: 3260 }
    retrieved: 2026-08-23
    notes: >-
      MediaWiki interface strings, translated per language by a named contributor,
