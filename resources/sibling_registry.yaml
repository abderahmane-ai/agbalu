    tier: reference
    access: hf
    uri: https://huggingface.co/datasets/Tamazight-NLP/Pontoon-Translations
    licence: mpl-2.0
    languages: [tzm_Latn, shi_Latn]
    size: { rows: 269 }
    retrieved: 2026-08-23
