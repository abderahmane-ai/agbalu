# AƔBALU Dihya-22M: Pan-Amazigh & Multi-Script Language Identification Data Registry
#
# Exhaustive catalog of remote datasets, digitized archives, and endpoints for
# automated download on the HPC cluster. Covers 15 Amazigh varieties across 4 scripts
# (Latin, Neo-Tifinagh, Arabic script, Arabizi) and 5 negative distractor classes.
#
# Validated for download via: make data FAMILY=dihya

version: "2.0.0"
surveyed: "2026-11-01"

sources:
  # =========================================================================
  # 1. SHAWIYA (Tacawit / shy) — Target: >50,000 sentences
  # =========================================================================
  - id: scriptureearth.shy.latin
    language: shy
    script: Latn
    variety: shawiya
    domain: scripture
    trust: gold
    licence: cc-by-nc-nd-4.0
    access: https
    url: https://www.scriptureearth.org/data/shy/PDF/
    files:
      - Genesis_shy_Latn.pdf
      - Psalms_shy_Latn.pdf
      - Luke_shy_Latn.pdf
      - Matthew_shy_Latn.pdf
      - Acts_shy_Latn.pdf
    notes: >-
      Official Awal n Rebbi s Tcawit Latin edition. Perfectly parallel to Kabyle
      and Tashelhit scripture, providing an exact domain-matched contrast spine.

